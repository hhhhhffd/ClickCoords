plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'com.clickcoords'

loom {
    splitEnvironmentSourceSets()
    mods {
        clickcoords {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('runExactClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    runDir.set(file(providers.gradleProperty('qaClientDir').getOrElse('build/qa-client')))
    useXVFB.set(false)
    jvmArgs.addAll('-Xms512m', '-Xmx2G')
    programArgs.addAll('--username', providers.gradleProperty('qaUsername').getOrElse('CoordsQA'),
            '--accessToken', '0', '--version', minecraft_version)
}

sourceSets {
    coordRegression {
        java.srcDir('tests')
        compileClasspath += sourceSets.client.runtimeClasspath
        runtimeClasspath += sourceSets.client.runtimeClasspath
    }
}
tasks.register('coordinateParserRegression', JavaExec) {
    classpath = sourceSets.coordRegression.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'CoordinateParserTest'
}
tasks.register('chatCoordinateRegression', JavaExec) {
    classpath = sourceSets.coordRegression.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'com.clickcoords.ChatCoordinatesTest'
}
tasks.named('check') {
    dependsOn 'coordinateParserRegression', 'chatCoordinateRegression'
}
